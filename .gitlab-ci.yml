stages:
  - test
  - build
  - publish

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PYTHON: "python3.12"
  UV_PYTHON_PREFERENCE: "only-system"
  UV_PYTHON_DOWNLOAD: "0"

default:
  image: python:3.12-slim
  tags:
    - hifis-linux-small-amd64
    - dind
    - hifis
  before_script:
    - python -m pip install --upgrade pip uv

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .uv-cache/

pytest:
  stage: test
  script:
    - uv sync --group dev
    - uv run pytest

build:
  stage: build
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

publish_testpypi:
  stage: publish
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+a\d+$/'
  script:
    - uv publish --repository testpypi --token "$TESTPYPI_TOKEN"

publish_pypi:
  stage: publish
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - uv publish --token "$PYPI_TOKEN"
